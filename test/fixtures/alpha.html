<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=1280, height=720">
<title>alpha</title>
<style>
  /* No page background: with --alpha everything outside the shapes is transparent. */
  body { margin: 0; font: 600 64px system-ui, sans-serif; color: #fff; }
  #gl { position: absolute; left: 80px; top: 80px; width: 480px; height: 480px; }
  .card { position: absolute; left: 640px; top: 120px; width: 480px; height: 280px; border-radius: 40px;
    background: rgba(59, 143, 217, .55); box-shadow: 0 20px 60px rgba(0, 0, 0, .6); animation: slide 2s linear both; }
  .glow { position: absolute; left: 700px; top: 440px; width: 360px; height: 220px;
    background: radial-gradient(closest-side, rgba(242, 165, 65, 1), rgba(242, 165, 65, 0)); }
  .title { position: absolute; left: 680px; top: 200px; animation: fade 2s linear both; }
  @keyframes slide { from { transform: translateX(-200px); } to { transform: translateX(0); } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
</style></head>
<body>
<canvas id="gl" width="480" height="480"></canvas>
<div class="card"></div>
<div class="glow"></div>
<div class="title">Alpha 透明</div>
<script>
// WebGL with a transparent clear colour: a half-transparent triangle spinning in rAF.
const canvas = document.getElementById('gl'), gl = canvas.getContext('webgl', { alpha: true, premultipliedAlpha: true });
const shader = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
const program = gl.createProgram();
gl.attachShader(program, shader(gl.VERTEX_SHADER, 'attribute vec2 p; uniform float a; void main(){ gl_Position = vec4(cos(a)*p.x - sin(a)*p.y, sin(a)*p.x + cos(a)*p.y, 0, 1); }'));
gl.attachShader(program, shader(gl.FRAGMENT_SHADER, 'precision mediump float; void main(){ gl_FragColor = vec4(0.94, 0.28, 0.44, 1.0) * 0.6; }'));
gl.linkProgram(program); gl.useProgram(program);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, .9, -.8, -.6, .8, -.6]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const angle = gl.getUniformLocation(program, 'a'), began = performance.now();
(function tick(now) {
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform1f(angle, (now - began) / 1000); gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(tick);
})(began);
</script>
</body></html>
